<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Panel Update</title>
<style>
  /* Menggunakan font blocky yang disimulasikan untuk estetika retro */
  body {
    margin: 0;
    padding: 0;
    background-color: #333;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Arial Black', Gadget, sans-serif;
  }

  .panel-outer {
    position: relative;
    width: 600px;
    height: 300px;
    background-color: #f7e0bc; /* Warna border panel luar */
    border-radius: 20px;
    box-shadow: 10px 10px 0px rgba(0,0,0,0.5); /* Bayangan luar */
    overflow: hidden;
  }

  .panel-inner {
    position: absolute;
    top: 15px;
    left: 15px;
    width: calc(100% - 30px);
    height: calc(100% - 60px);
    background-color: #f1b333; /* Latar belakang utama (kuning-oranye) */
    border-radius: 15px;
    overflow: hidden;
  }

  .green-background {
    position: absolute;
    top: 0;
    right: 0;
    width: 45%;
    height: 100%;
    background-color: #9aca76; /* Latar belakang hijau */
    border-radius: 0 15px 15px 0;
  }

  /* Data URI SVG untuk bentuk abstrak hitam */
  .abstract-shape {
    position: absolute;
    top: -10%; /* Vertikal relatif terhadap text block */
    right: 5%;
    width: 350px;
    height: 160px;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="30,70 50,30 65,65 85,15 100,50 65,100" fill="black" stroke="black" stroke-width="2"/></svg>');
    background-repeat: no-repeat;
    background-size: cover;
    z-index: 1;
    transform: rotate(10deg);
  }

  .keyboard-keys {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 45px;
    background-color: #f7e0bc;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 2;
  }

  .key {
    width: 25px;
    height: 35px;
    background-color: #fff;
    border-radius: 5px;
    border: 2px solid #ccc; /* Border key */
  }

  /* Grup Kapsul Terpadu dengan Teks yang Dipindah dan Terintegrasi */
  .capsule-group {
    position: absolute;
    top: 55%; /* Posisi vertikal, di bagian bawah panel atas */
    left: 20%;
    display: flex;
    align-items: center;
    z-index: 3;
    pointer-events: none; /* Mencegah interaksi teks jika perlu */
  }

  /* **AREA BORDER KAPSUL** */
  .stylized-capsule-border {
    position: absolute;
    top: -15px;
    left: -15px;
    width: calc(100% + 30px);
    height: calc(100% + 30px);
    background-color: rgba(255, 255, 255, 0.9); /* Area kapsul putih */
    border-radius: 15px;
    z-index: -1;
    /* Mensimulasikan outline border putih visual */
  }

  .text-prefix {
    font-size: 50px;
    font-weight: bold;
    color: #000;
    text-shadow:
      -2px -2px 0 #fff,
       2px -2px 0 #fff,
      -2px  2px 0 #fff,
       2px  2px 0 #fff;
    margin-right: 15px;
  }

  .stylized-cm {
    font-size: 60px;
    font-weight: bold;
    font-style: italic;
    color: #000;
    text-shadow:
      -2px -2px 0 #fff,
       2px -2px 0 #fff,
      -2px  2px 0 #fff,
       2px  2px 0 #fff;
    margin-right: 30px; /* Jarak presisi untuk teks yang terintegrasi */
  }

  /* **TEKS MOVED DAN RIGHT-ALIGNED** */
  .disconnected-text {
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    text-shadow: 2px 2px 0px rgba(0,0,0,0.6); /* Outline/bayangan tipis */
    font-family: sans-serif; /* Font sans-serif yang lebih bersih untuk teks kecil */
  }

</style>
</head>
<body>
  <div class="panel-outer">
    <div class="panel-inner">
      <div class="green-background"></div>
      <div class="abstract-shape"></div>
    </div>
    <div class="keyboard-keys">
      <div class="key"></div>
      <div class="key"></div>
      <div class="key"></div>
      <div class="key"></div>
      <div class="key"></div>
      <div class="key"></div>
      <div class="key"></div>
      <div class="key"></div>
      <div class="key"></div>
    </div>
    
    <div class="capsule-group">
      <div class="stylized-capsule-border"></div>
      <span class="text-prefix">-</span>
      <div class="stylized-cm">CM</div>
      <span class="disconnected-text">disconnected</span>
    </div>
  </div>
</body>
</html>
