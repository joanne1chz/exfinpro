<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Ticktock Golden</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;600&display=swap" rel="stylesheet">
    <style>
        /* Impor font Mobitale Cnd */
        @font-face {
            font-family: 'Mobitale Cnd';
            src: local('Mobitale Cnd'), local('Mobitale-Cnd');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #57BCB6; 
            overflow-y: auto; 
            overflow-x: hidden;
        }

        .landing-container {
            width: 100vw;
            height: 148vw; 
            background-image: url('https://github.com/joanne1chz/exfinpro/blob/main/Bg.png?raw=true');
            background-repeat: no-repeat;
            background-position: top center; 
            background-size: 100% auto; 
            position: relative; 
        }

        /* --- WRAPPER MAIN MENU --- */
        .main-menu-wrapper {
            position: absolute;
            top: 6vw;
            right: 5vw;
            width: 52vw;
            height: auto;
            z-index: 10;
        }

        .main-menu-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- CONTAINER STATUS KIPAS (Kotak Biru) --- */
        .status-container {
            position: absolute;
            top: 46.5%; 
            left: 71.5%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 0.8vw; 
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-size: 4.5vw; 
            font-weight: bold;
            white-space: nowrap;
        }

        .status-text {
            text-transform: uppercase;
            background: linear-gradient(to bottom, #75D6FF, #0783B7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: 
                drop-shadow(0px 4px 0px #0269B9)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }

        .status-emoji {
            -webkit-text-fill-color: initial; 
            background: none;
            filter: drop-shadow(0px 3px 0px #0269B9);
        }

        /* --- INDIKATOR JARAK (Kotak Oren Kiri) --- */
        .bus-distance {
            position: absolute;
            top: 65%; 
            left: 62%;
            transform: translate(-50%, -50%);
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-size: 4.5vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;
            filter: 
                drop-shadow(0px 4px 0px #000000)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }

        /* --- STATUS KONEKSI (Kapsul Hitam Kanan) --- */
        .bus-status {
            position: absolute;
            top: 69%; 
            left: 83%; 
            transform: translate(-50%, -50%);
            font-family: 'Inter', sans-serif;
            font-weight: 600; 
            font-size: 1.5vw; 
            color: #EAE0CD;
            text-transform: lowercase; 
            white-space: nowrap;
            filter: 
                drop-shadow(1px 1px 0px #493A31)
                drop-shadow(-1px -1px 0px #493A31)
                drop-shadow(1px -1px 0px #493A31)
                drop-shadow(-1px 1px 0px #493A31);
        }

        /* --- JAM REAL-TIME WIB (Kotak Putih Pertama) --- */
        .realtime-clock {
            position: absolute;
            top: 86.5%; 
            left: 28.2%;
            transform: translate(-50%, -50%);
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic; 
            font-size: 4.5vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;
            filter: 
                drop-shadow(0px 4px 0px #000000)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }

        /* --- SUHU CELCIUS DHT (Kotak Putih Kedua) --- */
        .temperature-display {
            position: absolute;
            top: 86.5%; 
            left: 55%; 
            transform: translate(-50%, -50%);
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic; 
            font-size: 4.5vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;
            filter: 
                drop-shadow(0px 4px 0px #000000)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }

        /* --- HARI & TANGGAL (Kotak Putih Ketiga) --- */
        .date-display {
            position: absolute;
            top: 86.5%; 
            left: 82%; 
            transform: translate(-50%, -50%);
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic; 
            font-size: 2.8vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;
            text-align: center;
            line-height: 1.1; 
            text-shadow: 
                -1.5px -1.5px 0 #fff,  
                 1.5px -1.5px 0 #fff,
                -1.5px  1.5px 0 #fff,
                 1.5px  1.5px 0 #fff,
                 0px 3px 0px #000000;
        }

        /* --- FIREBASE MENU --- */
        .firebase-menu-wrapper {
            position: absolute;
            top: 68vw; 
            left: 6vw; 
            width: 38vw; 
            height: auto;
            z-index: 10;
        }

        .firebase-menu-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .firebase-input {
            position: absolute;
            width: 31vw; 
            height: 3vw; 
            background: transparent; 
            border: none;
            outline: none;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 1.5vw;
            font-weight: 600;
            padding-left: 0.5vw; 
            transform: rotate(-1deg); 
        }

        .firebase-input::placeholder {
            color: rgba(255, 255, 255, 0.6); 
        }

        #api-key-input {
            top: 21.0%; 
            left: 4.5vw;
        }

        #db-url-input {
            top: 43.5%; 
            left: 4.5vw;
        }

        #node-path-input {
            top: 66.5%; 
            left: 4.5vw;
        }

        .firebase-btn {
            position: absolute;
            top: 85.5%; 
            left: 4.5vw;
            width: 11vw; 
            height: 3.2vw;
            background-color: #3FAEA8; 
            border: 2px solid #ffffff; 
            border-radius: 0.8vw; 
            color: #ffffff;
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic;
            font-size: 1.5vw;
            font-weight: bold;
            cursor: pointer;
            transform: rotate(-1deg); 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .firebase-btn:hover {
            background-color: #33938E; 
            transform: rotate(-1deg) scale(1.03);
        }

        /* --- MICROBIT MENU INTERAKTIF --- */
        .microbit-menu-wrapper {
            position: absolute;
            top: 68vw; 
            right: 6vw; 
            width: 38vw; 
            height: auto;
            z-index: 10;
        }

        .microbit-menu-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .microbit-click-zone {
            position: absolute;
            width: 34.5vw;
            height: 6.8vw;
            left: 1.8vw;
            background: rgba(255, 255, 255, 0); 
            border: none;
            border-radius: 1.2vw;
            cursor: pointer;
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic;
            font-weight: bold;
            color: #ffffff;
            font-size: 2.6vw; 
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 
                -0.18vw -0.18vw 0 #000000,  
                 0.18vw -0.18vw 0 #000000,
                -0.18vw  0.18vw 0 #000000,
                 0.18vw  0.18vw 0 #000000,
                 0px     0.35vw 0 #000000;
            transition: all 0.15s ease;
        }

        .microbit-click-zone:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.015);
        }

        .microbit-click-zone:active {
            background: rgba(0, 0, 0, 0.15);
            transform: scale(0.985);
        }

        #microbit-connect-btn {
            top: 19.5%; 
        }

        #microbit-disconnect-btn {
            top: 55.5%; 
        }

        /* --- SYSTEM TERMINAL INTERAKTIF (KOTAK HITAM) --- */
        .terminal-wrapper {
            position: absolute;
            top: 106vw; 
            left: 50%;
            transform: translateX(-50%);
            width: 88vw; 
            height: auto;
            z-index: 10;
        }

        .terminal-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Kontainer teks log di dalam area kotak hitam terminal */
        .terminal-log-container {
            position: absolute;
            top: 22%;    /* Mengikuti area letak mulainya kotak hitam pada asset */
            left: 3.5%;  /* Mengikuti lekukan padding sisi kiri kotak hitam */
            width: 93%;  /* Menyesuaikan lebar dalam kotak hitam */
            height: 72%; /* Batas tinggi area hitam agar tidak meluber keluar */
            background: transparent;
            overflow-y: auto; /* Mengaktifkan fungsi scroll ke bawah jika log penuh */
            padding: 1vw 1.5vw;
            display: flex;
            flex-direction: column;
            gap: 0.4vw;
            
            /* Aturan Styling Font Sesuai Request */
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            font-size: 1.2vw; /* Ukuran kecil presisi */
            line-height: 1.4;
            text-align: left;
        }

        /* Desain baris log agar scannable */
        .log-line {
            word-break: break-all;
            white-space: pre-wrap;
        }
        
        .log-info { color: #ffffff; }
        .log-success { color: #4EFA9E; } /* Hijau neon tipis agar log sukses terlihat jelas */
        .log-error { color: #FF5A5A; }   /* Merah tipis untuk pemberitahuan error */
        .log-warn { color: #FFD43F; }    /* Kuning untuk warning */

        /* Kustomisasi scrollbar terminal agar tetap estetik minimalis */
        .terminal-log-container::-webkit-scrollbar {
            width: 0.5vw;
        }
        .terminal-log-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .terminal-log-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 1vw;
        }
    </style>
</head>
<body>

    <div class="landing-container">
        
        <div class="main-menu-wrapper">
            <img src="https://github.com/joanne1chz/exfinpro/blob/main/Main.png?raw=true" alt="Main Menu" class="main-menu-img">
            
            <div class="status-container" id="main-status-kipas">
                <span class="status-text">OFF</span>
                <span class="status-emoji">🫠</span>
            </div>

            <div class="bus-distance" id="main-jarak-bus">- CM</div>
            
            <div class="bus-status" id="bus-status-text">disconnected</div>

            <div class="realtime-clock" id="realtime-clock">00.00</div>

            <div class="temperature-display" id="main-temperature">- C</div>

            <div class="date-display" id="realtime-date">
                Thursday<br>4/6/26
            </div>
        </div>

        <div class="firebase-menu-wrapper">
            <img src="https://github.com/joanne1chz/exfinpro/blob/main/firebase.png?raw=true" alt="Firebase Menu" class="firebase-menu-img">
            
            <input type="text" id="api-key-input" class="firebase-input" placeholder="Masukkan API Key...">
            <input type="text" id="db-url-input" class="firebase-input" placeholder="Masukkan URL Database...">
            <input type="text" id="node-path-input" class="firebase-input" placeholder="Masukkan Node Path...">
            
            <button id="firebase-connect-btn" class="firebase-btn">Connect</button>
        </div>

        <div class="microbit-menu-wrapper">
            <img src="https://github.com/joanne1chz/exfinpro/blob/main/microbit.png?raw=true" alt="Microbit Menu" class="microbit-menu-img">
            
            <button id="microbit-connect-btn" class="microbit-click-zone">Connect Microbit</button>
            <button id="microbit-disconnect-btn" class="microbit-click-zone">Disconnect</button>
        </div>

        <div class="terminal-wrapper">
            <img src="https://github.com/joanne1chz/exfinpro/blob/main/system%20terminal.png?raw=true" alt="System Terminal" class="terminal-img">
            <div id="terminal-log-container" class="terminal-log-container"></div>
        </div>
    </div>

    <script>
        // --- LOGIKA UTAMA MESIN TERMINAL LOG ---
        function writeToTerminal(message, type = 'info') {
            const logContainer = document.getElementById('terminal-log-container');
            if (!logContainer) return;

            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0]; // Mengambil format HH:MM:SS

            // Format standard log: [HH:MM:SS] [TAG] Message
            let tag = '[SYSTEM]';
            if (type === 'success') tag = '[SUCCESS]';
            if (type === 'error') tag = '[ERROR]';
            if (type === 'warn') tag = '[WARN]';

            const logLine = document.createElement('div');
            logLine.className = `log-line log-${type}`;
            logLine.innerText = `[${timeString}] ${tag} ${message}`;

            logContainer.appendChild(logLine);
            
            // Auto-scroll otomatis ke baris paling bawah saat log baru masuk
            logContainer.scrollTop = logContainer.scrollHeight;
        }


        // --- LOGIKA KONEKSI MICRO:BIT VIA BLUETOOTH API ---
        let bluetoothDevice = null;

        document.getElementById('microbit-connect-btn').addEventListener('click', async function() {
            writeToTerminal("Membuka native menu browser... Silakan pilih perangkat Micro:bit Anda.", "info");
            
            if (!navigator.bluetooth) {
                writeToTerminal("Web Bluetooth API tidak didukung di browser ini. Gunakan Chrome/Edge!", "error");
                alert("Browser Anda tidak mendukung Web Bluetooth API. Gunakan Google Chrome atau Microsoft Edge!");
                return;
            }

            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: ['e95d13b1-251d-470a-a062-fa1922dfa9a8']
                });

                writeToTerminal(`Menghubungkan ke device: ${bluetoothDevice.name}...`, "info");
                const server = await bluetoothDevice.gatt.connect();
                
                writeToTerminal(`Berhasil terhubung secara aman dengan ${bluetoothDevice.name}!`, "success");
                alert("Koneksi Sukses! Web Bluetooth telah terhubung ke BBC micro:bit.");

            } catch (error) {
                if (error.name === "NotFoundError") {
                    writeToTerminal("Pemilihan perangkat dibatalkan oleh pengguna.", "warn");
                } else {
                    writeToTerminal(`Gagal tersambung via Bluetooth: ${error.message}`, "error");
                    alert("Gagal menyambungkan Bluetooth: " + error.message);
                }
            }
        });

        document.getElementById('microbit-disconnect-btn').addEventListener('click', function() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                writeToTerminal("Memutuskan hubungan komunikasi GATT Server Micro:bit...", "info");
                bluetoothDevice.gatt.disconnect();
                writeToTerminal("Perangkat BBC micro:bit berhasil diputus dengan aman.", "success");
                alert("Koneksi Micro:bit berhasil diputus secara aman.");
            } else {
                writeToTerminal("Perintah putus koneksi ditolak: Tidak ada perangkat Micro:bit aktif yang terhubung.", "warn");
                alert("Tidak ada perangkat Micro:bit aktif yang sedang terhubung saat ini.");
            }
        });


        // --- LOGIKA KONEKSI FIREBASE ---
        document.getElementById('firebase-connect-btn').addEventListener('click', function() {
            const apiKey = document.getElementById('api-key-input').value.trim();
            const dbUrl = document.getElementById('db-url-input').value.trim();
            const nodePath = document.getElementById('node-path-input').value.trim();

            writeToTerminal("Memvalidasi konfigurasi parameter Firebase Cloud...", "info");

            if (apiKey === "" || dbUrl === "" || nodePath === "") {
                writeToTerminal("Sinkronisasi Firebase gagal: Terdapat input field yang kosong!", "error");
                alert("Gagal Terhubung! Harap isi semua kolom API Key, Database URL, dan Node Path terlebih dahulu.");
                return;
            }

            if (!dbUrl.startsWith("http://") && !dbUrl.startsWith("https://")) {
                writeToTerminal("Sinkronisasi Firebase gagal: Format URL Database tidak valid.", "error");
                alert("Format Database URL salah! Harus diawali dengan http:// atau https://");
                return;
            }

            this.innerText = "Connecting...";
            writeToTerminal(`Melakukan handshake menuju URL node: ${nodePath}...`, "info");
            
            setTimeout(() => {
                this.innerText = "Connected";
                writeToTerminal("Firebase Cloud Sync Berhasil Terhubung! Aliran data siap disinkronisasikan.", "success");
                alert("Berhasil terhubung ke Firebase Cloud Sync! Data sekarang siap disinkronkan.");
            }, 1500);
        });

        // --- LOGIKA OTOMATIS RUNNING CLOCK & STATUS ---
        function updateUltrasonicStatus() {
            const distanceElement = document.getElementById('main-jarak-bus');
            const statusElement = document.getElementById('bus-status-text');
            
            if (!distanceElement || !statusElement) return;

            let rawText = distanceElement.innerText.trim().toUpperCase();
            if (rawText === "" || rawText === "- CM" || rawText.includes("-")) {
                statusElement.innerText = "disconnected";
                return;
            }

            let distanceValue = parseInt(rawText.replace(/[^0-9]/g, ''));
            if (isNaN(distanceValue)) {
                statusElement.innerText = "disconnected";
            } else if (distanceValue === 0) {
                statusElement.innerText = "arrived";
            } else if (distanceValue > 0) {
                statusElement.innerText = "upcoming";
            }
        }

        function updateRealTimeClock() {
            const clockElement = document.getElementById('realtime-clock');
            if (!clockElement) return;

            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Jakarta',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            
            const parts = formatter.formatToParts(now);
            const hour = parts.find(p => p.type === 'hour').value;
            const minute = parts.find(p => p.type === 'minute').value;
            clockElement.innerText = `${hour}.${minute}`;
        }

        function updateRealTimeDate() {
            const dateElement = document.getElementById('realtime-date');
            if (!dateElement) return;

            const now = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[now.getDay()];
            const day = now.getDate();
            const month = now.getMonth() + 1;
            const year = now.getFullYear().toString().slice(-2);

            dateElement.innerHTML = `${dayName}<br>${day}/${month}/${year}`;
        }

        // Booting pertama kali saat halaman selesai dimuat
        window.addEventListener('DOMContentLoaded', () => {
            writeToTerminal("Menginisialisasi modul Core Dashboard System...", "info");
            updateUltrasonicStatus();
            updateRealTimeClock();
            updateRealTimeDate();
            writeToTerminal("Sistem terminal siap. Menunggu perintah koneksi perangkat...", "success");
            
            setInterval(() => {
                updateRealTimeClock();
                updateRealTimeDate();
            }, 1000);
        });
    </script>
</body>
</html>
