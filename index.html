<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Ticktock Golden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #57BCB6; 
            overflow-y: auto; 
            overflow-x: hidden;
        }

        .landing-container {
            width: 100vw;
            height: 148vw; 
            background-image: url('https://github.com/joanne1chz/exfinpro/blob/main/Bg.png?raw=true');
            background-repeat: no-repeat;
            background-position: top center; 
            background-size: 100% auto; 
            position: relative; 
        }

        /* --- STYLING MAIN MENU (Kanan Atas) --- */
        .main-menu {
            position: absolute;
            top: 6vw;
            right: 5vw;
            width: 52vw;
            height: auto;
            z-index: 10;
        }

        /* --- STYLING FIREBASE MENU (Kiri Bawah, Muncul Pas Di-scroll) --- */
        .firebase-menu {
            position: absolute;
            /* Diletakkan lebih bawah (di bawah arcade burung) */
            top: 62vw; 
            /* Di sebelah kiri sesuai kotak merah referensi */
            left: 6vw; 
            /* Ukuran disesuaikan agar proporsional di layar laptop */
            width: 44vw; 
            height: auto;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <img src="https://github.com/joanne1chz/exfinpro/blob/main/Main.png?raw=true" alt="Main Menu" class="main-menu">

        <img src="https://github.com/joanne1chz/exfinpro/blob/main/firebase.png?raw=true" alt="Firebase Menu" class="firebase-menu">
    </div>

</body>
</html>
