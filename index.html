<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Ticktock Golden (Versi Awal)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;600&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Mobitale Cnd';
            src: local('Mobitale Cnd'), local('Mobitale-Cnd');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #57BCB6; 
            overflow-y: auto; 
            overflow-x: hidden;
        }

        .landing-container {
            width: 100vw;
            height: 148vw; 
            background-image: url('https://github.com/joanne1chz/exfinpro/blob/main/Bg.png?raw=true');
            background-repeat: no-repeat;
            background-position: top center; 
            background-size: 100% auto; 
            position: relative; 
        }

        /* --- FLOATING STATUS INDICATORS --- */
        .floating-status-wrapper {
            position: fixed;
            top: 2vw;
            right: 2vw;
            display: flex;
            flex-direction: column;
            gap: 0.8vw;
            z-index: 9999;
        }

        .indicator-box {
            width: 11vw;
            height: 3vw;
            border-radius: 0.8vw;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic;
            font-weight: bold;
            font-size: 1.3vw;
            color: #ffffff;
            text-transform: capitalize;
            transition: all 0.3s ease;
        }

        .indicator-box.bt-offline { background-color: #564E4D; box-shadow: 0px 4px 0px #2D2726; }
        .indicator-box.db-offline { background-color: #EFA83E; box-shadow: 0px 4px 0px #A06716; }
        .indicator-box.bt-online { background-color: #2ECC71; box-shadow: 0px 4px 0px #1E8449; }
        .indicator-box.db-online { background-color: #3498DB; box-shadow: 0px 4px 0px #21618C; }

        /* --- WRAPPER MAIN MENU --- */
        .main-menu-wrapper {
            position: absolute;
            top: 6vw;
            right: 5vw;
            width: 52vw;
            height: auto;
            z-index: 10;
        }

        .main-menu-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .status-container {
            position: absolute;
            top: 46.5%; 
            left: 71.5%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 0.8vw; 
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-size: 4.5vw; 
            font-weight: bold;
            white-space: nowrap;
        }

        .status-text {
            text-transform: uppercase;
            background: linear-gradient(to bottom, #75D6FF, #0783B7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: 
                drop-shadow(0px 4px 0px #0269B9)
                drop-shadow(2px 2px 0px #fff) drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff) drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff) drop-shadow(0px -2px 0px #fff);
        }

        .status-emoji {
            -webkit-text-fill-color: initial; 
            background: none;
            filter: drop-shadow(0px 3px 0px #0269B9);
        }

        .bus-distance {
            position: absolute;
            top: 65%; 
            left: 62%;
            transform: translate(-50%, -50%);
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-size: 4.5vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;
            filter: 
                drop-shadow(0px 4px 0px #000000)
                drop-shadow(2px 2px 0px #fff) drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) drop-shadow(-2px 2px 0px #fff);
        }

        .bus-status {
            position: absolute;
            top: 69%; 
            left: 83%; 
            transform: translate(-50%, -50%);
            font-family: 'Inter', sans-serif;
            font-weight: 600; 
            font-size: 1.5vw; 
            color: #EAE0CD;
            text-transform: lowercase; 
            white-space: nowrap;
            filter: drop-shadow(1px 1px 0px #493A31) drop-shadow(-1px -1px 0px #493A31);
        }

        .realtime-clock {
            position: absolute;
            top: 86.5%; 
            left: 28.2%;
            transform: translate(-50%, -50%);
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic; 
            font-size: 4.5vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;
            filter: drop-shadow(0px 4px 0px #000000) drop-shadow(2px 2px 0px #fff);
        }

        .temperature-display {
            position: absolute;
            top: 86.5%; 
            left: 55%; 
            transform: translate(-50%, -50%);
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic; 
            font-size: 4.5vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;
            filter: drop-shadow(0px 4px 0px #000000) drop-shadow(2px 2px 0px #fff);
        }

        .date-display {
            position: absolute;
            top: 86.5%; 
            left: 82%; 
            transform: translate(-50%, -50%);
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic; 
            font-size: 2.8vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;
            text-align: center;
            line-height: 1.1; 
            text-shadow: -1.5px -1.5px 0 #fff, 1.5px -1.5px 0 #fff, 0px 3px 0px #000000;
        }

        /* --- FIREBASE MENU --- */
        .firebase-menu-wrapper { position: absolute; top: 68vw; left: 6vw; width: 38vw; height: auto; z-index: 10; }
        .firebase-menu-img { width: 100%; height: auto; display: block; }
        .firebase-input {
            position: absolute; width: 31vw; height: 3vw; background: transparent; border: none; outline: none;
            color: #ffffff; font-family: 'Inter', sans-serif; font-size: 1.5vw; font-weight: 600; padding-left: 0.5vw; transform: rotate(-1deg); 
        }
        #api-key-input { top: 21.0%; left: 4.5vw; }
        #db-url-input { top: 43.5%; left: 4.5vw; }
        #node-path-input { top: 66.5%; left: 4.5vw; }
        .firebase-btn {
            position: absolute; top: 85.5%; left: 4.5vw; width: 11vw; height: 3.2vw; background-color: #3FAEA8; 
            border: 2px solid #ffffff; border-radius: 0.8vw; color: #ffffff; font-family: 'Mobitale Cnd'; font-style: italic;
            font-size: 1.5vw; font-weight: bold; cursor: pointer; transform: rotate(-1deg); display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        .firebase-btn:hover { background-color: #33938E; transform: rotate(-1deg) scale(1.03); }

        /* --- MICROBIT MENU INTERAKTIF --- */
        .microbit-menu-wrapper { position: absolute; top: 68vw; right: 6vw; width: 38vw; height: auto; z-index: 10; }
        .microbit-menu-img { width: 100%; height: auto; display: block; }
        .microbit-click-zone {
            position: absolute; width: 34.5vw; height: 6.8vw; left: 1.8vw; background: rgba(255, 255, 255, 0); border: none; border-radius: 1.2vw;
            cursor: pointer; font-family: 'Mobitale Cnd'; font-style: italic; font-weight: bold; color: #ffffff; font-size: 2.6vw; 
            display: flex; align-items: center; justify-content: center;
            text-shadow: -0.18vw -0.18vw 0 #000000, 0.18vw -0.18vw 0 #000000, 0px 0.35vw 0 #000000; transition: all 0.15s ease;
        }
        .microbit-click-zone:hover { background: rgba(255, 255, 255, 0.12); transform: scale(1.015); }
        #microbit-connect-btn { top: 19.5%; }
        #microbit-disconnect-btn { top: 55.5%; }

        /* --- SYSTEM TERMINAL INTERAKTIF --- */
        .terminal-wrapper { position: absolute; top: 106vw; left: 50%; transform: translateX(-50%); width: 88vw; height: auto; z-index: 10; }
        .terminal-img { width: 100%; height: auto; display: block; }
        .terminal-log-container {
            position: absolute; top: 31%; left: 3.5%; width: 93%; height: 63%; background: transparent; overflow-y: auto; 
            padding: 0.5vw 1.5vw; display: flex; flex-direction: column; gap: 0.4vw; font-family: 'Inter', sans-serif; color: #ffffff; font-size: 1.2vw; line-height: 1.4;
        }
        .log-line { word-break: break-all; white-space: pre-wrap; }
        .log-info { color: #ffffff; }
        .log-success { color: #4EFA9E; } 
        .log-error { color: #FF5A5A; }   
        .log-warn { color: #FFD43F; }    
        .terminal-log-container::-webkit-scrollbar { width: 0.5vw; }
        .terminal-log-container::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 1vw; }
    </style>
</head>
<body>

    <div class="floating-status-wrapper">
        <div id="bt-status-box" class="indicator-box bt-offline">BT Offline</div>
        <div id="db-status-box" class="indicator-box db-offline">DB Offline</div>
    </div>

    <div class="landing-container">
        <div class="main-menu-wrapper">
            <img src="https://github.com/joanne1chz/exfinpro/blob/main/Main.png?raw=true" alt="Main Menu" class="main-menu-img">
            
            <div class="status-container" id="main-status-kipas">
                <span class="status-text" id="kipas-text">OFF</span>
                <span class="status-emoji" id="kipas-emoji">🫠</span>
            </div>

            <div class="bus-distance" id="main-jarak-bus">- CM</div>
            <div class="bus-status" id="bus-status-text">disconnected</div>
            <div class="realtime-clock" id="realtime-clock">00.00</div>
            <div class="temperature-display" id="main-temperature">- C</div>
            <div class="date-display" id="realtime-date">Thursday<br>4/6/26</div>
        </div>

        <div class="firebase-menu-wrapper">
            <img src="https://github.com/joanne1chz/exfinpro/blob/main/firebase.png?raw=true" alt="Firebase Menu" class="firebase-menu-img">
            <input type="text" id="api-key-input" class="firebase-input" placeholder="Masukkan API Key...">
            <input type="text" id="db-url-input" class="firebase-input" placeholder="Masukkan URL Database...">
            <input type="text" id="node-path-input" class="firebase-input" placeholder="Masukkan Node Path...">
            <button id="firebase-connect-btn" class="firebase-btn">Connect</button>
        </div>

        <div class="microbit-menu-wrapper">
            <img src="https://github.com/joanne1chz/exfinpro/blob/main/microbit.png?raw=true" alt="Microbit Menu" class="microbit-menu-img">
            <button id="microbit-connect-btn" class="microbit-click-zone">Connect Microbit</button>
            <button id="microbit-disconnect-btn" class="microbit-click-zone">Disconnect</button>
        </div>

        <div class="terminal-wrapper">
            <img src="https://github.com/joanne1chz/exfinpro/blob/main/system%20terminal.png?raw=true" alt="System Terminal" class="terminal-img">
            <div id="terminal-log-container" class="terminal-log-container"></div>
        </div>
    </div>

    <script>
        // --- CENTRAL TERMINAL LOG ENGINE ---
        function writeToTerminal(message, type = 'info') {
            const logContainer = document.getElementById('terminal-log-container');
            if (!logContainer) return;
            const now = new Date();
            const timeString = now.toTimeString().split(' ')[0];
            let tag = '[SYSTEM]';
            if (type === 'success') tag = '[SUCCESS]';
            if (type === 'error') tag = '[ERROR]';
            if (type === 'warn') tag = '[WARN]';

            const logLine = document.createElement('div');
            logLine.className = `log-line log-${type}`;
            logLine.innerText = `[${timeString}] ${tag} ${message}`;
            logContainer.appendChild(logLine);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // --- WEB BLUETOOTH DATA PARSER LOGIC ---
        let bluetoothDevice = null;
        let rxCharacteristic = null;
        let receivedDataBuffer = ""; 
        const btStatusBox = document.getElementById('bt-status-box');

        // Fungsi Pemecah Data Masuk dari Microbit (Mengisi data - C dan - CM secara real-time)
        function handleMicrobitData(rawData) {
            receivedDataBuffer += rawData;
            
            while (receivedDataBuffer.includes("\n")) {
                let lineIdx = receivedDataBuffer.indexOf("\n");
                let currentLine = receivedDataBuffer.substring(0, lineIdx).trim();
                receivedDataBuffer = receivedDataBuffer.substring(lineIdx + 1);

                if (currentLine.includes(":")) {
                    let parts = currentLine.split(":");
                    let key = parts[0].trim();
                    let val = parseInt(parts[1].trim());

                    if (isNaN(val)) continue;

                    // 1. UPDATE DISPLAY TEMPERATURE
                    if (key === "suhu") {
                        document.getElementById('main-temperature').innerText = val + " C";
                    }
                    
                    // 2. UPDATE ULTRASONIC & SITUASI STATUS TEXT
                    else if (key === "jarak") {
                        document.getElementById('main-jarak-bus').innerText = val + " CM";
                        
                        const statusTextElement = document.getElementById('bus-status-text');
                        if (val > 0 && val <= 30) {
                            statusTextElement.innerText = "upcoming";
                        } else if (val === 0) {
                            statusTextElement.innerText = "arrived";
                        } else {
                            statusTextElement.innerText = "disconnected";
                        }
                    }
                    
                    // 3. UPDATE INDIKATOR STATUS VISUAL KIPAS
                    else if (key === "kipas") {
                        const txtEl = document.getElementById('kipas-text');
                        const emjEl = document.getElementById('kipas-emoji');
                        if (val === 1) {
                            txtEl.innerText = "ON";
                            emjEl.innerText = "🥶"; 
                        } else {
                            txtEl.innerText = "OFF";
                            emjEl.innerText = "🫠";
                        }
                    }
                }
            }
        }

        // --- CONNECT MICROBIT BUTTON ACTION ---
        document.getElementById('microbit-connect-btn').addEventListener('click', async function() {
            writeToTerminal("Membuka native menu browser... Silakan pilih perangkat Micro:bit Anda.", "info");
            if (!navigator.bluetooth) {
                writeToTerminal("Web Bluetooth API tidak didukung di browser ini. Gunakan Chrome/Edge!", "error");
                return;
            }

            try {
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: ['e95d13b1-251d-470a-a062-fa1922dfa9a8']
                });

                writeToTerminal(`Menghubungkan ke device: ${bluetoothDevice.name}...`, "info");
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService('e95d13b1-251d-470a-a062-fa1922dfa9a8');
                
                rxCharacteristic = await service.getCharacteristic('e95d9250-251d-470a-a062-fa1922dfa9a8');
                
                await rxCharacteristic.startNotifications();
                rxCharacteristic.addEventListener('characteristicvaluechanged', (event) => {
                    let decoder = new TextDecoder('utf-8');
                    let chunk = decoder.decode(event.target.value);
                    handleMicrobitData(chunk);
                });

                btStatusBox.innerText = "BT Online";
                btStatusBox.className = "indicator-box bt-online";
                writeToTerminal(`Berhasil terhubung secara aman dengan ${bluetoothDevice.name}! Aliran data sensor aktif.`, "success");

            } catch (error) {
                writeToTerminal(`Gagal tersambung via Bluetooth: ${error.message}`, "error");
            }
        });

        // --- DISCONNECT BUTTON ACTION ---
        document.getElementById('microbit-disconnect-btn').addEventListener('click', function() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
                btStatusBox.innerText = "BT Offline";
                btStatusBox.className = "indicator-box bt-offline";
                
                // Reset visual data display kembali ke default
                document.getElementById('main-temperature').innerText = "- C";
                document.getElementById('main-jarak-bus').innerText = "- CM";
                document.getElementById('bus-status-text').innerText = "disconnected";
                
                writeToTerminal("Perangkat BBC micro:bit berhasil diputus dengan aman.", "success");
            }
        });

        // --- FIREBASE SYNC LOGIC ---
        const dbStatusBox = document.getElementById('db-status-box');
        document.getElementById('firebase-connect-btn').addEventListener('click', function() {
            const apiKey = document.getElementById('api-key-input').value.trim();
            const dbUrl = document.getElementById('db-url-input').value.trim();
            const nodePath = document.getElementById('node-path-input').value.trim();

            if (apiKey === "" || dbUrl === "" || nodePath === "") {
                writeToTerminal("Sinkronisasi Firebase gagal: Terdapat input field yang kosong!", "error");
                return;
            }
            this.innerText = "Connecting...";
            setTimeout(() => {
                this.innerText = "Connected";
                dbStatusBox.innerText = "DB Online";
                dbStatusBox.className = "indicator-box db-online";
                writeToTerminal("Firebase Cloud Sync Berhasil Terhubung!", "success");
            }, 1000);
        });

        // --- CLOCK INDONESIA WEST TIME (WIB) ---
        function updateRealTimeClock() {
            const clockElement = document.getElementById('realtime-clock');
            if (!clockElement) return;
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', hour12: false
            });
            const parts = formatter.formatToParts(now);
            const hour = parts.find(p => p.type === 'hour').value;
            const minute = parts.find(p => p.type === 'minute').value;
            clockElement.innerText = `${hour}.${minute}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            writeToTerminal("Menginisialisasi modul Core Dashboard System...", "info");
            updateRealTimeClock();
            setInterval(updateRealTimeClock, 1000);
            writeToTerminal("Sistem terminal siap. Menunggu perintah koneksi perangkat...", "success");
        });
    </script>
</body>
</html>
