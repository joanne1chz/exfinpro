<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Aset Visual</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh; /* Ukuran sebesar layar laptop */
            background-color: #57BCB6; /* Warna latar belakang geometris dasar */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Sembunyikan scroll jika ada */
        }

        .visual-container {
            width: 100%;
            height: 100%;
            /* Menggunakan visual referensi yang bersih sebagai gambar latar belakang */
            background-image: url('image_0.png'); 
            background-repeat: no-repeat;
            background-position: top center; /* Memposisikan konsol/robot di atas */
            background-size: cover; /* Untuk memenuhi area dengan aset, disesuaikan untuk laptop */
            position: relative;
        }
    </style>
</head>
<body>
    <div class="visual-container">
        </div>
</body>
</html>
