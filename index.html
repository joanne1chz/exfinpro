<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Ticktock Golden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #57BCB6; 
            overflow-y: auto; 
            overflow-x: hidden;
        }

        .landing-container {
            width: 100vw;
            height: 148vw; 
            background-image: url('https://github.com/joanne1chz/exfinpro/blob/main/Bg.png?raw=true');
            background-repeat: no-repeat;
            background-position: top center; 
            background-size: 100% auto; 
            position: relative; /* Menjadi acuan untuk posisi main menu */
        }

        /* --- STYLING MAIN MENU ASSET --- */
        .main-menu {
            position: absolute;
            /* Mengatur posisi di sebelah kanan karakter burung */
            top: 6vw;
            right: 5vw;
            /* Mengatur ukuran proporsional terhadap lebar layar laptop */
            width: 52vw;
            height: auto;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <img src="https://github.com/joanne1chz/exfinpro/blob/main/Main.png?raw=true" alt="Main Menu" class="main-menu">
    </div>

</body>
</html>
