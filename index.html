<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Ticktock Golden</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
    <style>
        /* Impor font Mobitale Cnd */
        @font-face {
            font-family: 'Mobitale Cnd';
            src: local('Mobitale Cnd'), local('Mobitale-Cnd');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #57BCB6; 
            overflow-y: auto; 
            overflow-x: hidden;
        }

        .landing-container {
            width: 100vw;
            height: 148vw; 
            background-image: url('https://github.com/joanne1chz/exfinpro/blob/main/Bg.png?raw=true');
            background-repeat: no-repeat;
            background-position: top center; 
            background-size: 100% auto; 
            position: relative; 
        }

        /* --- WRAPPER MAIN MENU --- */
        .main-menu-wrapper {
            position: absolute;
            top: 6vw;
            right: 5vw;
            width: 52vw;
            height: auto;
            z-index: 10;
        }

        .main-menu-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- CONTAINER STATUS KIPAS (Kotak Biru) --- */
        .status-container {
            position: absolute;
            top: 46.5%; 
            left: 71.5%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 0.8vw; 
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-size: 4.5vw; 
            font-weight: bold;
            white-space: nowrap;
        }

        .status-text {
            text-transform: uppercase;
            background: linear-gradient(to bottom, #75D6FF, #0783B7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: 
                drop-shadow(0px 4px 0px #0269B9)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }

        .status-emoji {
            -webkit-text-fill-color: initial; 
            background: none;
            filter: drop-shadow(0px 3px 0px #0269B9);
        }


        /* --- INDIKATOR JARAK (Kotak Oren Kiri) --- */
        .bus-distance {
            position: absolute;
            top: 65%; 
            left: 62%;
            transform: translate(-50%, -50%);
            
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-size: 4.5vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;

            filter: 
                drop-shadow(0px 4px 0px #000000)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }

        /* --- STATUS KONEKSI (Kapsul Hitam Kanan) --- */
        .bus-status {
            position: absolute;
            top: 69%; 
            left: 83%; 
            transform: translate(-50%, -50%);
            
            font-family: 'Inter', sans-serif;
            font-weight: 600; 
            font-size: 1.5vw; 
            color: #EAE0CD;
            text-transform: lowercase; 
            white-space: nowrap;
            
            filter: 
                drop-shadow(1px 1px 0px #493A31)
                drop-shadow(-1px -1px 0px #493A31)
                drop-shadow(1px -1px 0px #493A31)
                drop-shadow(-1px 1px 0px #493A31);
        }

        /* --- JAM REAL-TIME WIB (Kotak Putih Pertama) --- */
        .realtime-clock {
            position: absolute;
            top: 86.5%; 
            left: 28.2%;
            transform: translate(-50%, -50%);
            
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic; 
            font-size: 4.5vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;

            filter: 
                drop-shadow(0px 4px 0px #000000)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }

        /* --- SUHU CELCIUS DHT (Kotak Putih Kedua) --- */
        .temperature-display {
            position: absolute;
            top: 86.5%; 
            left: 55%; 
            transform: translate(-50%, -50%);
            
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic; 
            font-size: 4.5vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;

            filter: 
                drop-shadow(0px 4px 0px #000000)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }

        /* --- HARI & TANGGAL (Kotak Putih Ketiga) --- */
        .date-display {
            position: absolute;
            top: 86.5%; 
            left: 82%; /* Diperkirakan di tengah kotak putih ketiga */
            transform: translate(-50%, -50%);
            
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic; 
            font-size: 2.8vw; /* Font lebih kecil supaya muat atas-bawah */
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;
            text-align: center;
            line-height: 1.1; /* Mengatur jarak antar baris supaya rapat/grup */

            /* Efek shadow sama persis */
            filter: 
                drop-shadow(0px 4px 0px #000000)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }


        /* --- ASSET LAIN --- */
        .firebase-menu {
            position: absolute;
            top: 68vw; 
            left: 6vw; 
            width: 38vw; 
            height: auto;
            z-index: 10;
        }

        .microbit-menu {
            position: absolute;
            top: 68vw; 
            right: 6vw; 
            width: 38vw; 
            height: auto;
            z-index: 10;
        }

        .terminal-menu {
            position: absolute;
            top: 106vw; 
            left: 50%;
            transform: translateX(-50%);
            width: 88vw; 
            height: auto;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="landing-container">
        
        <div class="main-menu-wrapper">
            <img src="https://github.com/joanne1chz/exfinpro/blob/main/Main.png?raw=true" alt="Main Menu" class="main-menu-img">
            
            <div class="status-container" id="main-status-kipas">
                <span class="status-text">OFF</span>
                <span class="status-emoji">🫠</span>
            </div>

            <div class="bus-distance" id="main-jarak-bus">- CM</div>
            
            <div class="bus-status" id="bus-status-text">disconnected</div>

            <div class="realtime-clock" id="realtime-clock">00.00</div>

            <div class="temperature-display" id="main-temperature">- C</div>

            <div class="date-display" id="realtime-date">
                Thursday<br>4/6/26
            </div>
        </div>

        <img src="https://github.com/joanne1chz/exfinpro/blob/main/firebase.png?raw=true" alt="Firebase Menu" class="firebase-menu">

        <img src="https://github.com/joanne1chz/exfinpro/blob/main/microbit.png?raw=true" alt="Microbit Menu" class="microbit-menu">

        <img src="https://github.com/joanne1chz/exfinpro/blob/main/system%20terminal.png?raw=true" alt="System Terminal" class="terminal-menu">
    </div>

    <script>
        // Logika otomatis update status tulisan mengikuti nilai jarak sensor
        function updateUltrasonicStatus() {
            const distanceElement = document.getElementById('main-jarak-bus');
            const statusElement = document.getElementById('bus-status-text');
            
            if (!distanceElement || !statusElement) return;

            let rawText = distanceElement.innerText.trim().toUpperCase();

            if (rawText === "" || rawText === "- CM" || rawText.includes("-")) {
                statusElement.innerText = "disconnected";
                return;
            }

            let distanceValue = parseInt(rawText.replace(/[^0-9]/g, ''));

            if (isNaN(distanceValue)) {
                statusElement.innerText = "disconnected";
            } else if (distanceValue === 0) {
                statusElement.innerText = "arrived";
            } else if (distanceValue > 0) {
                statusElement.innerText = "upcoming";
            }
        }

        // Logika jam real-time khusus zona waktu Asia/Jakarta (WIB)
        function updateRealTimeClock() {
            const clockElement = document.getElementById('realtime-clock');
            if (!clockElement) return;

            const now = new Date();
            
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Jakarta',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            
            const parts = formatter.formatToParts(now);
            const hour = parts.find(p => p.type === 'hour').value;
            const minute = parts.find(p => p.type === 'minute').value;

            clockElement.innerText = `${hour}.${minute}`;
        }

        // Logika tanggal real-time (Hari dan DD/MM/YY)
        function updateRealTimeDate() {
            const dateElement = document.getElementById('realtime-date');
            if (!dateElement) return;

            const now = new Date();
            
            // Mengambil nama hari
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[now.getDay()];

            // Format tanggal DD/MM/YY
            const day = now.getDate();
            const month = now.getMonth() + 1; // getMonth dimulai dari 0
            const year = now.getFullYear().toString().slice(-2); // Ambil 2 digit terakhir tahun

            // Masukkan pakai <br> supaya jadi 2 baris
            dateElement.innerHTML = `${dayName}<br>${day}/${month}/${year}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateUltrasonicStatus();
            updateRealTimeClock();
            updateRealTimeDate();
            
            // Update jam dan tanggal setiap detik
            setInterval(() => {
                updateRealTimeClock();
                updateRealTimeDate();
            }, 1000);
        });
    </script>
</body>
</html>
