<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Ticktock Golden</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
    <style>
        /* Impor font Mobitale Cnd */
        @font-face {
            font-family: 'Mobitale Cnd';
            src: local('Mobitale Cnd'), local('Mobitale-Cnd');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #57BCB6; 
            overflow-y: auto; 
            overflow-x: hidden;
        }

        .landing-container {
            width: 100vw;
            height: 148vw; 
            background-image: url('https://github.com/joanne1chz/exfinpro/blob/main/Bg.png?raw=true');
            background-repeat: no-repeat;
            background-position: top center; 
            background-size: 100% auto; 
            position: relative; 
        }

        /* --- WRAPPER MAIN MENU --- */
        .main-menu-wrapper {
            position: absolute;
            top: 6vw;
            right: 5vw;
            width: 52vw;
            height: auto;
            z-index: 10;
        }

        .main-menu-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- CONTAINER STATUS KIPAS (Kotak Biru) --- */
        .status-container {
            position: absolute;
            top: 46.5%; 
            left: 71.5%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 0.8vw; 
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-size: 4.5vw; 
            font-weight: bold;
            white-space: nowrap;
        }

        .status-text {
            text-transform: uppercase;
            background: linear-gradient(to bottom, #75D6FF, #0783B7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: 
                drop-shadow(0px 4px 0px #0269B9)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }

        .status-emoji {
            -webkit-text-fill-color: initial; 
            background: none;
            filter: drop-shadow(0px 3px 0px #0269B9);
        }


        /* --- CONTAINER INDIKATOR BUS ULTRASONIK --- */
        .bus-container {
            position: absolute;
            top: 65%; 
            left: 62%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            /* Memberikan jarak relatif yang pas antara angka CM dan kapsul status hitam */
            gap: 2vw; 
            white-space: nowrap;
        }

        /* Gaya untuk Angka Jarak (Target Kotak Kiri Ultrasonik) */
        .bus-distance {
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-size: 4.5vw; 
            font-weight: bold;
            color: #000000; 

            filter: 
                drop-shadow(0px 4px 0px #000000)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }

        /* Gaya Keterangan Status Terkoneksi (Target Area Kapsul Hitam) */
        .bus-status {
            font-family: 'Inter', sans-serif;
            font-weight: 600; /* Semi Bold */
            font-size: 2.8vw; /* Menyesuaikan ukuran agar presisi di dalam kapsul */
            color: #EAE0CD;
            text-transform: lowercase; /* Menyamakan format visual 'upcoming' */
            
            /* Efek stroke tipis sesuai instruksi */
            filter: 
                drop-shadow(1px 1px 0px #493A31)
                drop-shadow(-1px -1px 0px #493A31)
                drop-shadow(1px -1px 0px #493A31)
                drop-shadow(-1px 1px 0px #493A31);
            
            /* Memberikan sedikit dorongan margin kiri & atas jika posisi kapsul background agak bergeser */
            margin-left: 2.5vw;
            margin-top: 0.4vw;
        }


        /* --- ASSET LAIN --- */
        .firebase-menu {
            position: absolute;
            top: 68vw; 
            left: 6vw; 
            width: 38vw; 
            height: auto;
            z-index: 10;
        }

        .microbit-menu {
            position: absolute;
            top: 68vw; 
            right: 6vw; 
            width: 38vw; 
            height: auto;
            z-index: 10;
        }

        .terminal-menu {
            position: absolute;
            top: 106vw; 
            left: 50%;
            transform: translateX(-50%);
            width: 88vw; 
            height: auto;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="landing-container">
        
        <div class="main-menu-wrapper">
            <img src="https://github.com/joanne1chz/exfinpro/blob/main/Main.png?raw=true" alt="Main Menu" class="main-menu-img">
            
            <div class="status-container" id="main-status-kipas">
                <span class="status-text">OFF</span>
                <span class="status-emoji">🫠</span>
            </div>

            <div class="bus-container">
                <span class="bus-distance" id="main-jarak-bus">3 CM</span>
                <span class="bus-status" id="bus-status-text">disconnected</span>
            </div>
        </div>

        <img src="https://github.com/joanne1chz/exfinpro/blob/main/firebase.png?raw=true" alt="Firebase Menu" class="firebase-menu">

        <img src="https://github.com/joanne1chz/exfinpro/blob/main/microbit.png?raw=true" alt="Microbit Menu" class="microbit-menu">

        <img src="https://github.com/joanne1chz/exfinpro/blob/main/system%20terminal.png?raw=true" alt="System Terminal" class="terminal-menu">
    </div>

    <script>
        // Fungsi otomatis untuk mengupdate teks logic status berdasarkan nilai jarak ultrasonik
        function updateUltrasonicStatus() {
            const distanceElement = document.getElementById('main-jarak-bus');
            const statusElement = document.getElementById('bus-status-text');
            
            if (!distanceElement || !statusElement) return;

            // Mengambil teks mentah (misal: "3 CM" atau "- CM")
            let rawText = distanceElement.innerText.trim().toUpperCase();

            // Jika belum terkoneksi, data kosong, atau mengandung strip "-"
            if (rawText === "" || rawText === "-" || rawText.includes("-")) {
                statusElement.innerText = "disconnected";
                return;
            }

            // Mengambil angka saja dari teks (menghilangkan string "CM")
            let distanceValue = parseInt(rawText.replace(/[^0-9]/g, ''));

            // Logika pengecekan nilai sensor ultrasonik
            if (isNaN(distanceValue)) {
                statusElement.innerText = "disconnected";
            } else if (distanceValue === 0) {
                statusElement.innerText = "arrived";
            } else if (distanceValue > 0) {
                statusElement.innerText = "upcoming";
            }
        }

        // Jalankan fungsi saat halaman pertama kali dimuat
        window.addEventListener('DOMContentLoaded', updateUltrasonicStatus);

        /* TIPS INTEGRASI:
          Jika nanti kamu mengupdate teks '#main-jarak-bus' secara real-time lewat Firebase script-mu, 
          panggil kembali fungsi `updateUltrasonicStatus()` tepat setelah nilai jaraknya berubah!
        */
    </script>
</body>
</html>
