<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Ticktock Golden</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
    <style>
        /* Impor font Mobitale Cnd */
        @font-face {
            font-family: 'Mobitale Cnd';
            src: local('Mobitale Cnd'), local('Mobitale-Cnd');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #57BCB6; 
            overflow-y: auto; 
            overflow-x: hidden;
        }

        .landing-container {
            width: 100vw;
            height: 148vw; 
            background-image: url('https://github.com/joanne1chz/exfinpro/blob/main/Bg.png?raw=true');
            background-repeat: no-repeat;
            background-position: top center; 
            background-size: 100% auto; 
            position: relative; 
        }

        /* --- WRAPPER MAIN MENU --- */
        .main-menu-wrapper {
            position: absolute;
            top: 6vw;
            right: 5vw;
            width: 52vw;
            height: auto;
            z-index: 10;
        }

        .main-menu-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- CONTAINER STATUS KIPAS (Kotak Biru) --- */
        .status-container {
            position: absolute;
            top: 46.5%; 
            left: 71.5%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 0.8vw; 
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-size: 4.5vw; 
            font-weight: bold;
            white-space: nowrap;
        }

        .status-text {
            text-transform: uppercase;
            background: linear-gradient(to bottom, #75D6FF, #0783B7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: 
                drop-shadow(0px 4px 0px #0269B9)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }

        .status-emoji {
            -webkit-text-fill-color: initial; 
            background: none;
            filter: drop-shadow(0px 3px 0px #0269B9);
        }

        /* --- INDIKATOR JARAK (Kotak Oren Kiri) --- */
        .bus-distance {
            position: absolute;
            top: 65%; 
            left: 62%;
            transform: translate(-50%, -50%);
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-size: 4.5vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;
            filter: 
                drop-shadow(0px 4px 0px #000000)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }

        /* --- STATUS KONEKSI (Kapsul Hitam Kanan) --- */
        .bus-status {
            position: absolute;
            top: 69%; 
            left: 83%; 
            transform: translate(-50%, -50%);
            font-family: 'Inter', sans-serif;
            font-weight: 600; 
            font-size: 1.5vw; 
            color: #EAE0CD;
            text-transform: lowercase; 
            white-space: nowrap;
            filter: 
                drop-shadow(1px 1px 0px #493A31)
                drop-shadow(-1px -1px 0px #493A31)
                drop-shadow(1px -1px 0px #493A31)
                drop-shadow(-1px 1px 0px #493A31);
        }

        /* --- JAM REAL-TIME WIB (Kotak Putih Pertama) --- */
        .realtime-clock {
            position: absolute;
            top: 86.5%; 
            left: 28.2%;
            transform: translate(-50%, -50%);
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic; 
            font-size: 4.5vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;
            filter: 
                drop-shadow(0px 4px 0px #000000)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }

        /* --- SUHU CELCIUS DHT (Kotak Putih Kedua) --- */
        .temperature-display {
            position: absolute;
            top: 86.5%; 
            left: 55%; 
            transform: translate(-50%, -50%);
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic; 
            font-size: 4.5vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;
            filter: 
                drop-shadow(0px 4px 0px #000000)
                drop-shadow(2px 2px 0px #fff) 
                drop-shadow(-2px -2px 0px #fff) 
                drop-shadow(2px -2px 0px #fff) 
                drop-shadow(-2px 2px 0px #fff)
                drop-shadow(2px 0px 0px #fff)
                drop-shadow(-2px 0px 0px #fff)
                drop-shadow(0px 2px 0px #fff)
                drop-shadow(0px -2px 0px #fff);
        }

        /* --- HARI & TANGGAL (Kotak Putih Ketiga) --- */
        .date-display {
            position: absolute;
            top: 86.5%; 
            left: 82%; 
            transform: translate(-50%, -50%);
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic; 
            font-size: 2.8vw; 
            font-weight: bold;
            color: #000000; 
            white-space: nowrap;
            text-align: center;
            line-height: 1.1; 
            text-shadow: 
                -1.5px -1.5px 0 #fff,  
                 1.5px -1.5px 0 #fff,
                -1.5px  1.5px 0 #fff,
                 1.5px  1.5px 0 #fff,
                 0px 3px 0px #000000;
        }

        /* --- FIREBASE MENU --- */
        .firebase-menu-wrapper {
            position: absolute;
            top: 68vw; 
            left: 6vw; 
            width: 38vw; 
            height: auto;
            z-index: 10;
        }

        .firebase-menu-img {
            width: 100%;
            height: auto;
            display: block;
        }

        .firebase-input {
            position: absolute;
            width: 31vw; 
            height: 3vw; 
            background: transparent; 
            border: none;
            outline: none;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 1.5vw;
            font-weight: 600;
            padding-left: 0.5vw; 
            transform: rotate(-1deg); 
        }

        .firebase-input::placeholder {
            color: rgba(255, 255, 255, 0.6); 
        }

        #api-key-input {
            top: 21.0%; 
            left: 4.5vw;
        }

        #db-url-input {
            top: 43.5%; 
            left: 4.5vw;
        }

        #node-path-input {
            top: 66.5%; 
            left: 4.5vw;
        }

        .firebase-btn {
            position: absolute;
            top: 85.5%; 
            left: 4.5vw;
            width: 11vw; 
            height: 3.2vw;
            background-color: #3FAEA8; 
            border: 2px solid #ffffff; 
            border-radius: 0.8vw; 
            color: #ffffff;
            font-family: 'Mobitale Cnd', 'Arial Black', sans-serif;
            font-style: italic;
            font-size: 1.5vw;
            font-weight: bold;
            cursor: pointer;
            transform: rotate(-1deg); 
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .firebase-btn:hover {
            background-color: #33938E; 
            transform: rotate(-1deg) scale(1.03);
        }

        .firebase-btn:active {
            transform: rotate(-1deg) scale(0.95);
        }

        /* --- MICROBIT MENU INTERAKTIF --- */
        .microbit-menu-wrapper {
            position: absolute;
            top: 68vw; 
            right: 6vw; 
            width: 38vw; 
            height: auto;
            z-index: 10;
        }

        .microbit-menu-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Tombol Transparan Presisi Mengikuti Gambar Desain */
        .microbit-click-zone {
            position: absolute;
            width: 34.5vw;
            height: 6.8vw;
            left: 1.8vw;
            background: rgba(255, 255, 255, 0); /* Transparan penuh agar gambar asli terlihat */
            border: none;
            border-radius: 1vw;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        /* Efek feedback visual halus saat diarahkan kursor & diklik */
        .microbit-click-zone:hover {
            background: rgba(255, 255, 255, 0.12); 
        }

        .microbit-click-zone:active {
            background: rgba(0, 0, 0, 0.15);
        }

        #microbit-connect-btn {
            top: 19.5%; /* Pas di atas area 'Connect Microbit' */
        }

        #microbit-disconnect-btn {
            top: 55.5%; /* Pas di atas area 'Disconnect' */
        }

        /* Text Keterangan Status Pendukung */
        .microbit-status-badge {
            position: absolute;
            top: 3.5%;
            right: 4.5%;
            font-family: 'Inter', sans-serif;
            font-size: 1.1vw;
            font-weight: 600;
            color: #FFB3B3; /* Default merah soft pas terputus */
            background: rgba(0, 0, 0, 0.45);
            padding: 0.2vw 0.8vw;
            border-radius: 0.4vw;
            text-transform: uppercase;
            letter-spacing: 0.05vw;
            pointer-events: none; /* Klik tembus ke bawah */
        }

        /* --- TERMINAL ASSET --- */
        .terminal-menu {
            position: absolute;
            top: 106vw; 
            left: 50%;
            transform: translateX(-50%);
            width: 88vw; 
            height: auto;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="landing-container">
        
        <div class="main-menu-wrapper">
            <img src="https://github.com/joanne1chz/exfinpro/blob/main/Main.png?raw=true" alt="Main Menu" class="main-menu-img">
            
            <div class="status-container" id="main-status-kipas">
                <span class="status-text">OFF</span>
                <span class="status-emoji">🫠</span>
            </div>

            <div class="bus-distance" id="main-jarak-bus">- CM</div>
            
            <div class="bus-status" id="bus-status-text">disconnected</div>

            <div class="realtime-clock" id="realtime-clock">00.00</div>

            <div class="temperature-display" id="main-temperature">- C</div>

            <div class="date-display" id="realtime-date">
                Thursday<br>4/6/26
            </div>
        </div>

        <div class="firebase-menu-wrapper">
            <img src="https://github.com/joanne1chz/exfinpro/blob/main/firebase.png?raw=true" alt="Firebase Menu" class="firebase-menu-img">
            
            <input type="text" id="api-key-input" class="firebase-input" placeholder="Masukkan API Key...">
            <input type="text" id="db-url-input" class="firebase-input" placeholder="Masukkan URL Database...">
            <input type="text" id="node-path-input" class="firebase-input" placeholder="Masukkan Node Path...">
            
            <button id="firebase-connect-btn" class="firebase-btn">Connect</button>
        </div>

        <div class="microbit-menu-wrapper">
            <img src="https://github.com/joanne1chz/exfinpro/blob/main/microbit.png?raw=true" alt="Microbit Menu" class="microbit-menu-img">
            
            <div id="microbit-status" class="microbit-status-badge">OFFLINE</div>

            <button id="microbit-connect-btn" class="microbit-click-zone" title="Connect Micro:bit via Bluetooth"></button>
            <button id="microbit-disconnect-btn" class="microbit-click-zone" title="Disconnect Micro:bit"></button>
        </div>

        <img src="https://github.com/joanne1chz/exfinpro/blob/main/system%20terminal.png?raw=true" alt="System Terminal" class="terminal-menu">
    </div>

    <script>
        // --- LOGIKA KONEKSI MICRO:BIT VIA BLUETOOTH ---
        let bluetoothDevice = null;

        document.getElementById('microbit-connect-btn').addEventListener('click', async function() {
            const statusBadge = document.getElementById('microbit-status');
            
            // Cek apakah browser mendukung Web Bluetooth
            if (!navigator.bluetooth) {
                alert("Browser Anda tidak mendukung Web Bluetooth API. Gunakan Chrome, Edge, atau Opera!");
                return;
            }

            try {
                statusBadge.innerText = "PAIRING...";
                statusBadge.style.color = "#FFE699"; // Kuning tanda memproses

                // Request device Bluetooth Micro:bit secara real-time
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }],
                    optionalServices: ['e95d13b1-251d-470a-a062-fa1922dfa9a8'] // UUID Layanan default m:b
                });

                statusBadge.innerText = "CONNECTING...";
                const server = await bluetoothDevice.gatt.connect();

                // Berhasil terhubung!
                statusBadge.innerText = "ONLINE";
                statusBadge.style.color = "#A3FFB4"; // Hijau terang sukses
                alert("Koneksi Sukses! Web Bluetooth telah terhubung ke BBC micro:bit.");

            } catch (error) {
                console.log("Koneksi Bluetooth Dibatalkan/Gagal:", error);
                statusBadge.innerText = "OFFLINE";
                statusBadge.style.color = "#FFB3B3";
                
                // Alert jika user menekan tombol cancel pada pop-up window pairing
                if (error.name !== "NotFoundError") {
                    alert("Gagal menyambungkan Bluetooth: " + error.message);
                }
            }
        });

        document.getElementById('microbit-disconnect-btn').addEventListener('click', function() {
            const statusBadge = document.getElementById('microbit-status');

            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
                alert("Koneksi Micro:bit berhasil diputus secara aman.");
            } else {
                alert("Tidak ada perangkat Micro:bit aktif yang sedang terhubung.");
            }

            statusBadge.innerText = "OFFLINE";
            statusBadge.style.color = "#FFB3B3";
        });


        // --- LOGIKA KONEKSI FIREBASE ---
        document.getElementById('firebase-connect-btn').addEventListener('click', function() {
            const apiKey = document.getElementById('api-key-input').value.trim();
            const dbUrl = document.getElementById('db-url-input').value.trim();
            const nodePath = document.getElementById('node-path-input').value.trim();

            if (apiKey === "" || dbUrl === "" || nodePath === "") {
                alert("Gagal Terhubung! Harap isi semua kolom API Key, Database URL, dan Node Path terlebih dahulu.");
                return;
            }

            if (!dbUrl.startsWith("http://") && !dbUrl.startsWith("https://")) {
                alert("Format Database URL salah! Harus diawali dengan http:// atau https://");
                return;
            }

            this.innerText = "Connecting...";
            
            setTimeout(() => {
                this.innerText = "Connected";
                alert("Berhasil terhubung ke Firebase Cloud Sync! Data sekarang siap disinkronkan.");
            }, 1500);
        });

        // --- LOGIKA OTOMATIS RUNNING ---
        function updateUltrasonicStatus() {
            const distanceElement = document.getElementById('main-jarak-bus');
            const statusElement = document.getElementById('bus-status-text');
            
            if (!distanceElement || !statusElement) return;

            let rawText = distanceElement.innerText.trim().toUpperCase();
            if (rawText === "" || rawText === "- CM" || rawText.includes("-")) {
                statusElement.innerText = "disconnected";
                return;
            }

            let distanceValue = parseInt(rawText.replace(/[^0-9]/g, ''));
            if (isNaN(distanceValue)) {
                statusElement.innerText = "disconnected";
            } else if (distanceValue === 0) {
                statusElement.innerText = "arrived";
            } else if (distanceValue > 0) {
                statusElement.innerText = "upcoming";
            }
        }

        function updateRealTimeClock() {
            const clockElement = document.getElementById('realtime-clock');
            if (!clockElement) return;

            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: 'Asia/Jakarta',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            
            const parts = formatter.formatToParts(now);
            const hour = parts.find(p => p.type === 'hour').value;
            const minute = parts.find(p => p.type === 'minute').value;
            clockElement.innerText = `${hour}.${minute}`;
        }

        function updateRealTimeDate() {
            const dateElement = document.getElementById('realtime-date');
            if (!dateElement) return;

            const now = new Date();
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const dayName = days[now.getDay()];
            const day = now.getDate();
            const month = now.getMonth() + 1;
            const year = now.getFullYear().toString().slice(-2);

            dateElement.innerHTML = `${dayName}<br>${day}/${month}/${year}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateUltrasonicStatus();
            updateRealTimeClock();
            updateRealTimeDate();
            
            setInterval(() => {
                updateRealTimeClock();
                updateRealTimeDate();
            }, 1000);
        });
    </script>
</body>
</html>
