<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Ticktock Golden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Warna background dasar sesuai permintaanmu */
            background-color: #57BCB6; 
            /* Mengizinkan halaman untuk di-scroll ke bawah */
            overflow-y: auto; 
            overflow-x: hidden;
        }

        .landing-container {
            width: 100vw;
            /* Tinggi diatur auto/min-height agar memanjang ke bawah mengikuti aspek rasio gambar */
            min-height: 200vh; 
            
            /* Memasukkan aset gambar */
            background-image: url('https://github.com/joanne1chz/exfinpro/blob/main/Bg.png?raw=true');
            background-repeat: no-repeat;
            
            /* Posisi dimulai dari atas dan pas di tengah secara horizontal */
            background-position: top center; 
            
            /* KUNCI: Gambar akan memenuhi lebar laptop, dan tingginya otomatis memanjang ke bawah */
            background-size: 100% auto; 
        }
    </style>
</head>
<body>

    <div class="landing-container">
        </div>

</body>
</html>
