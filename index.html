<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Aset Visual Kita</title>
    <style>
        /* Mengatur agar body memenuhi layar penuh tanpa margin */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            /* Latar belakang dasar sesuai permintaan */
            background-color: #57BCB6;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Sembunyikan scroll jika ada */
        }

        /* Kontainer untuk aset visual */
        .visual-container {
            width: 100%;
            height: 100%;
            /* Tautan gambar penuh yang benar untuk raw GitHub */
            background-image: url('https://github.com/joanne1chz/exfinpro/blob/main/Bg.png?raw=true'); 
            background-repeat: no-repeat;
            /* Memposisikan konsol/robot di bagian atas tengah */
            background-position: top center; 
            /* Memastikan gambar menutupi seluruh kontainer */
            background-size: cover; 
            position: relative;
        }
    </style>
</head>
<body>
    <div class="visual-container">
        </div>
</body>
</html>
