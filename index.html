<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page - Ticktock Golden</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Warna background dasar sesuai permintaanmu */
            background-color: #57BCB6; 
            overflow-y: auto; 
            overflow-x: hidden;
        }

        .landing-container {
            width: 100vw;
            /* Kita paksa tingginya menjadi 180% dari lebar layar agar pas dengan rasio gambar yang panjang */
            height: 180vw; 
            
            /* Memasukkan aset gambar */
            background-image: url('https://github.com/joanne1chz/exfinpro/blob/main/Bg.png?raw=true');
            background-repeat: no-repeat;
            
            /* Posisi dimulai dari paling atas */
            background-position: top center; 
            
            /* Gambar diatur agar selalu selebar layar (100%) dan memanjang ke bawah otomatis */
            background-size: 100% auto; 
        }
    </style>
</head>
<body>

    <div class="landing-container">
        </div>

</body>
</html>
